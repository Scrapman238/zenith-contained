<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zenith Proxy Manager</title>

    <!-- MDI Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-width: 750px;
        font-family: sans-serif;
        padding: 20px;
        background: #111;
        color: white;
      }

      h2 {
        margin-bottom: 20px;
      }

      #instances {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .instance {
        background: #222;
        border: 2px solid #444;
        border-radius: 10px;
        padding: 10px;
        gap: 10px;
        margin-bottom: 10px;
        height: 120px;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .instance .top {
        padding: 0;
        gap: 15px;
        display: flex;
        align-items: center;
        height: 80px;
      }

      .instance .bottom {
        padding: 0;
        display: flex;
        align-items: center;
        height: 30px;
      }

      .instance .bottom form {
        width: 100%;
        height: 100%;
        padding: 0;
        gap: 10px;
        display: flex;
        align-items: stretch;
      }

      .instance .bottom form input {
        flex: 2;
        border: 1px solid #444;
        border-radius: 5px;
        background-color: transparent;
        color: white;
        font-size: 14px;
      }

      .instance .bottom form button {
        flex: 1;
        border: 1px solid #444;
        border-radius: 5px;
        background-color: transparent;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      .instance-number {
        color: #888;
        font-family: monospace;
        font-size: 48px;
        width: 60px;
        text-align: center;
        transition: color 0.1s ease-in-out;
        user-select: none;
      }

      .separator {
        width: 2px;
        background: #444;
        border-radius: 1px;
        align-self: stretch;
      }

      .spacer {
        flex-grow: 1;
      }

      span[data-account] a {
        color: lightseagreen;
        text-decoration: underline;
      }

      span[data-account] {
        font-size: 40px;
        font-weight: 350;
        text-decoration: none;
      }

      .other-info {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      span[data-status],
      span[data-port] {
        font-size: 18px;
        text-align: right;
      }

      .instance span {
        white-space: nowrap;
      }

      .actions-btn {
        margin-left: auto;
        position: relative;
      }

      .actions-btn button {
        cursor: pointer;
        padding: 0;
        border: none;
        background: transparent;
        font-size: 32px;
        color: white;
        width: 40px;
      }

      .context-menu {
        display: none;
        position: absolute;
        top: 48px;
        right: 0;
        background: #333;
        border: 1px solid #555;
        border-radius: 5px;
        min-width: 120px;
        z-index: 10;
      }

      .context-menu span {
        display: block;
        padding: 6px 12px;
        cursor: pointer;
        border-bottom: 1px solid #444;
      }

      .context-menu span:last-child {
        border-bottom: none;
      }

      .context-menu span:hover {
        background: #444;
      }

      .context-menu .delete-btn {
        color: coral;
      }

      #addBtn {
        font-size: 16px;
        margin-top: 15px;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: white;
        cursor: pointer;
      }

      #addBtn:hover {
        background: #0069d9;
      }
    </style>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h2>Zenith Proxy Manager</h2>
    <ul id="instances"></ul>
    <button id="addBtn">
      <i class="mdi mdi-server-plus"></i> Add Instance
    </button>

    <div id="command-section" style="margin-top: 20px">
      <input
        type="text"
        id="commandInput"
        placeholder="Enter command for instance(s) and press Enter"
        style="
          padding: 8px;
          width: 300px;
          border-radius: 4px;
          border: 1px solid #555;
          background: #222;
          color: white;
        "
      />
      <div
        id="commandResponse"
        style="margin-top: 10px; white-space: pre-wrap; font-family: monospace"
      ></div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
