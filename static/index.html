<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zenith Proxy Manager</title>

    <!-- MDI Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-width: 750px;
        font-family: sans-serif;
        padding: 20px;
        background: #111;
        color: white;
      }

      h2 {
        margin-bottom: 20px;
      }

      #instances {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .instance {
        background: #222;
        border: 2px solid #444;
        border-radius: 10px;
        padding: 10px;
        gap: 15px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        height: 80px;
        position: relative;
      }

      .instance-number {
        color: #888;
        font-family: monospace;
        font-size: 48px;
        width: 60px;
        text-align: center;
        transition: color 0.1s ease-in-out;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .separator {
        width: 2px;
        background: #444;
        border-radius: 1px;
        align-self: stretch;
      }

      .spacer {
        flex-grow: 1;
      }

      span[data-account] {
        font-size: 40px;
        font-weight: 350;
      }

      .other-info {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      span[data-status] {
        font-size: 18px;
        text-align: right;
      }

      span[data-port] {
        font-size: 18px;
        text-align: right;
      }

      .instance span {
        white-space: nowrap;
      }

      .actions-btn {
        margin-left: auto;
        position: relative;
      }

      .actions-btn button {
        cursor: pointer;
        padding: 0;
        border: none;
        background: transparent;
        font-size: 32px;
        color: white;
        width: 40px;
      }

      .context-menu {
        display: none;
        position: absolute;
        top: 48px;
        right: 0;
        background: #333;
        border: 1px solid #555;
        border-radius: 5px;
        min-width: 120px;
        z-index: 10;
      }

      .context-menu span {
        display: block;
        padding: 6px 12px;
        cursor: pointer;
        border-bottom: 1px solid #444;
      }

      .context-menu span:last-child {
        border-bottom: none;
      }

      .context-menu span:hover {
        background: #444;
      }

      .context-menu .delete-btn {
        color: coral;
      }

      #addBtn {
        font-size: 16px;
        margin-top: 15px;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: white;
        cursor: pointer;
      }

      #addBtn:hover {
        background: #0069d9;
      }
    </style>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h2>Zenith Proxy Manager</h2>
    <ul id="instances"></ul>
    <button id="addBtn">
      <i class="mdi mdi-server-plus"></i> Add Instance
    </button>

    <div id="command-section" style="margin-top: 20px">
      <input
        type="text"
        id="commandInput"
        placeholder="Enter command for instance(s) and press Enter"
        style="
          padding: 8px;
          width: 300px;
          border-radius: 4px;
          border: 1px solid #555;
          background: #222;
          color: white;
        "
      />
      <div
        id="commandResponse"
        style="margin-top: 10px; white-space: pre-wrap; font-family: monospace"
      ></div>
    </div>

    <script>
      const containerMap = new Map();
      const selectedInstances = new Set();

      async function fetchContainers() {
        const res = await fetch("/api/containers");
        const data = await res.json();
        const list = document.getElementById("instances");

        data.sort((a, b) => a.instance - b.instance);

        const names = new Set(data.map((c) => c.name));

        // Remove deleted containers from DOM
        for (const [name, el] of containerMap.entries()) {
          if (!names.has(name)) {
            el.remove();
            containerMap.delete(name);
            selectedInstances.delete(name); // remove from selection
          }
        }

        data.forEach((c) => {
          if (containerMap.has(c.name)) {
            const el = containerMap.get(c.name);
            el.querySelector("[data-account]").textContent = c.account;
            el.querySelector("[data-status]").innerHTML =
              `${c.status} <i class="mdi mdi-information-box"></i>`;
            el.querySelector("[data-port]").innerHTML =
              `Port ${c.port} <i class="mdi mdi-server"></i>`;
          } else {
            const li = document.createElement("li");
            li.className = "instance";

            li.innerHTML = `
        <h1 class="instance-number">${c.instance}</h1>
        <div class="separator"></div>

        <span data-account>${c.account}</span>
        <div class="spacer"></div>

        <div class="other-info">
          <span data-status>${c.status} <i class="mdi mdi-information-box"></i></span>
          <span data-port>
            Port ${c.port}
            <i class="mdi mdi-server"></i>
          </span>
        </div>
        
        <div class="actions-btn">
          <button><i class="mdi mdi-dots-vertical"></i></button>
          <div class="context-menu">
            <span onclick="start('${c.name}')"><i class="mdi mdi-play"></i> Start</span>
            <span onclick="stop('${c.name}')"><i class="mdi mdi-stop"></i> Stop</span>
            <span onclick="restart('${c.name}')"><i class="mdi mdi-refresh"></i> Restart</span>
            <span class="delete-btn" onclick="del('${c.name}')"><i class="mdi mdi-delete"></i> Delete</span>
          </div>
        </div>
        `;

            containerMap.set(c.name, li);
            list.appendChild(li);

            const btn = li.querySelector(".actions-btn button");
            const menu = li.querySelector(".context-menu");

            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              document.querySelectorAll(".context-menu").forEach((m) => {
                if (m !== menu) m.style.display = "none";
              });
              menu.style.display =
                menu.style.display === "block" ? "none" : "block";
            });
          }
        });

        // Add click handlers for instance number selection
        data.forEach((c) => {
          const el = containerMap.get(c.name);
          if (!el) return;

          const instanceNumberEl = el.querySelector(".instance-number");
          instanceNumberEl.style.cursor = "pointer";
          instanceNumberEl.style.color = selectedInstances.has(c.name)
            ? "#29e026"
            : "#888";

          instanceNumberEl.onclick = () => {
            if (selectedInstances.has(c.name)) {
              selectedInstances.delete(c.name);
              instanceNumberEl.style.color = "#888";
            } else {
              selectedInstances.add(c.name);
              instanceNumberEl.style.color = "#29e026";
            }
          };
        });

        // Ensure ordering in DOM
        data.forEach((c) => {
          const el = containerMap.get(c.name);
          if (el) list.appendChild(el);
        });
      }

      async function start(name) {
        await fetch(`/api/containers/${name}/start`, { method: "POST" });
      }

      async function stop(name) {
        await fetch(`/api/containers/${name}/stop`, { method: "POST" });
      }

      async function restart(name) {
        await fetch(`/api/containers/${name}/restart`, { method: "POST" });
      }

      async function del(name) {
        if (confirm(`Delete ${name}?`)) {
          await fetch(`/api/containers/${name}/delete`, { method: "POST" });
          const el = containerMap.get(name);
          if (el) {
            el.remove();
            containerMap.delete(name);
            selectedInstances.delete(name);
          }
        }
      }

      // Command input: send to all selected instances on Enter
      document
        .getElementById("commandInput")
        .addEventListener("keydown", async (e) => {
          if (e.key !== "Enter") return;

          const commandInput = e.target;
          const responseDiv = document.getElementById("commandResponse");
          const command = commandInput.value.trim();

          if (!command) return;

          if (selectedInstances.size === 0) {
            responseDiv.textContent = "No instances selected!";
            return;
          }

          responseDiv.textContent = "Sending command...";
          commandInput.value = "";

          const results = [];
          for (const name of selectedInstances) {
            try {
              const res = await fetch(`/api/containers/${name}/send_command`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command }),
              });

              const data = await res.json();

              if (res.ok) {
                results.push(
                  `${name} → ${JSON.stringify(data.response_body, null, 2)}`,
                );
              } else {
                results.push(
                  `${name} → ERROR: ${data.message || JSON.stringify(data)}`,
                );
              }
            } catch (err) {
              results.push(`${name} → Request failed: ${err.message}`);
            }
          }

          responseDiv.textContent = results.join("\n\n");
        });

      document.getElementById("addBtn").onclick = async () => {
        await fetch("/api/containers/add", { method: "POST" });
      };

      document.addEventListener("click", () => {
        document.querySelectorAll(".context-menu").forEach((m) => {
          m.style.display = "none";
        });
      });

      setInterval(fetchContainers, 1000);
      fetchContainers();
    </script>
  </body>
</html>
